openapi: 3.0.3
info:
  title: Rest Api de Code Jira
  version: 1.0.0
  description: Documentación interactiva de la Api
paths:
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      description: Permite iniciar sesión a un usuario y obtener el access y el refresh.
      summary: Iniciar sesión
      tags:
      - Autenticación
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/v1/auth/register/:
    post:
      operationId: v1_auth_register_create
      description: Permite registrar un usuario sin la necesidad de estar autenticado.
        La ruta es pública.
      summary: Registrar usuario
      tags:
      - Autenticación
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/issues/:
    post:
      operationId: v1_issues_create
      description: Crea un Issue y permite adjuntar uno o más archivos en la misma
        petición
      summary: Crear un nuevo Issue
      tags:
      - Issue
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/IssueRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
          description: ''
  /api/v1/issues/{id}/status/:
    put:
      operationId: v1_issues_status_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Issue
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueStatusRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/IssueStatusRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/IssueStatusRequest'
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueStatus'
          description: ''
  /api/v1/projects/:
    post:
      operationId: v1_projects_create
      description: Crea un nuevo Project.
      summary: Registrar un nuevo Project para un Workspace
      tags:
      - Project
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProjectRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProjectRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
  /api/v1/projects/{id}/:
    get:
      operationId: v1_projects_retrieve
      description: Obtiene un Project activo por su ID
      summary: Obtener un Project
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Project
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
    put:
      operationId: v1_projects_update
      description: Actualiza un Projeect activo por su ID
      summary: Actualizar un Project
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Project
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProjectRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProjectRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
    patch:
      operationId: v1_projects_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Project
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProjectRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProjectRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProjectRequest'
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
    delete:
      operationId: v1_projects_destroy
      description: Elimina logicamente un Project activo por su ID
      summary: Eliminar logicamente un Project
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Project
      security:
      - jwtAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/projects/{project_id}/issues/:
    get:
      operationId: v1_projects_issues_list
      parameters:
      - in: path
        name: project_id
        schema:
          type: integer
        required: true
      tags:
      - Project
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Issue'
          description: ''
  /api/v1/tags/:
    get:
      operationId: v1_tags_list
      tags:
      - Tag
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tag'
          description: ''
    post:
      operationId: v1_tags_create
      tags:
      - Tag
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TagRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TagRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
          description: ''
  /api/v1/workspaces/:
    get:
      operationId: v1_workspaces_list
      description: Obtiene una lista paginada de todos los Workspaces activos en el
        sistema.
      summary: Listar todos los Workspaces
      tags:
      - Workspace
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Workspace'
          description: ''
    post:
      operationId: v1_workspaces_create
      description: Crea un nuevo Workspace. Asegúrate de enviar los campos requeridos.
        Solo accesible para usuarios autenticados.
      summary: Registrar un nuevo Workspace
      tags:
      - Workspace
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WorkspaceRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WorkspaceRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
          description: ''
  /api/v1/workspaces/{id}/:
    get:
      operationId: v1_workspaces_retrieve
      description: Obtiene un Workspace activo por su ID.
      summary: Obtener un Workspace
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Workspace
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
          description: ''
    put:
      operationId: v1_workspaces_update
      description: Actualizar un Workspace activo por su ID.
      summary: Actualizar un Workspace
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Workspace
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WorkspaceRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WorkspaceRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
          description: ''
    patch:
      operationId: v1_workspaces_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Workspace
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedWorkspaceRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedWorkspaceRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedWorkspaceRequest'
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
          description: ''
    delete:
      operationId: v1_workspaces_destroy
      description: Eliminar logicamente un Workspace activo por su ID.
      summary: Eliminar logicamente un Workspace
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Workspace
      security:
      - jwtAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/workspaces/{workspace_id}/projects/:
    get:
      operationId: v1_workspaces_projects_list
      description: Obtiene una lista paginada de todos los Projects activos de un
        Workspace
      summary: Listar todos los Projects
      parameters:
      - in: path
        name: workspace_id
        schema:
          type: integer
        required: true
      tags:
      - Workspace
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
          description: ''
  /api/v1/workspaces/members/:
    post:
      operationId: v1_workspaces_members_create
      description: Añade un Usuario como Miembro de un Workspace. Solo accesible para
        usuarios autenticados.
      summary: Registrar un Miembro en un Workspace
      tags:
      - Workspace
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceMemberRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WorkspaceMemberRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WorkspaceMemberRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMember'
          description: ''
components:
  schemas:
    Attachment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        file:
          type: string
          format: uri
        uploaded_at:
          type: string
          format: date-time
          readOnly: true
        issue:
          type: integer
        uploader:
          type: integer
          readOnly: true
          nullable: true
      required:
      - file
      - id
      - issue
      - uploaded_at
      - uploader
    AttachmentRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
        issue:
          type: integer
      required:
      - file
      - issue
    CustomTokenObtainPairRequest:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - username
    Issue:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
          readOnly: true
        tags:
          type: array
          items:
            type: integer
        deleted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
        status:
          $ref: '#/components/schemas/StatusEnum'
        priority:
          $ref: '#/components/schemas/PriorityEnum'
        due_date:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        project:
          type: integer
        reporter:
          type: integer
          readOnly: true
        assignee:
          type: integer
          nullable: true
        parent_issue:
          type: integer
          nullable: true
      required:
      - attachments
      - created_at
      - deleted_at
      - id
      - project
      - reporter
      - title
      - updated_at
    IssueRequest:
      type: object
      properties:
        uploaded_files:
          type: array
          items:
            type: string
            format: binary
          writeOnly: true
        tags:
          type: array
          items:
            type: integer
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
        status:
          $ref: '#/components/schemas/StatusEnum'
        priority:
          $ref: '#/components/schemas/PriorityEnum'
        due_date:
          type: string
          format: date-time
          nullable: true
        project:
          type: integer
        assignee:
          type: integer
          nullable: true
        parent_issue:
          type: integer
          nullable: true
      required:
      - project
      - title
    IssueStatus:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/StatusEnum'
    IssueStatusRequest:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/StatusEnum'
    PatchedProjectRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
        workspace:
          type: integer
    PatchedWorkspaceRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        slug:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
    PriorityEnum:
      enum:
      - LOW
      - MEDIUM
      - HIGH
      - URGENT
      type: string
      description: |-
        * `LOW` - Baja
        * `MEDIUM` - Media
        * `HIGH` - Alta
        * `URGENT` - Urgente
    Project:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        deleted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        name:
          type: string
          maxLength: 100
        description:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        workspace:
          type: integer
      required:
      - created_at
      - deleted_at
      - id
      - name
      - workspace
    ProjectRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
        workspace:
          type: integer
      required:
      - name
      - workspace
    RoleEnum:
      enum:
      - OWNER
      - ADMIN
      - MEMBER
      - GUEST
      type: string
      description: |-
        * `OWNER` - Propietario
        * `ADMIN` - Administrador
        * `MEMBER` - Miembro
        * `GUEST` - Invitado
    StatusEnum:
      enum:
      - BACKLOG
      - TODO
      - IN_PROGRESS
      - IN_REVIEW
      - DONE
      - CANCELED
      type: string
      description: |-
        * `BACKLOG` - Backlog
        * `TODO` - Por Hacer
        * `IN_PROGRESS` - En Progreso
        * `IN_REVIEW` - En Revision
        * `DONE` - Completado
        * `CANCELED` - Cancelado
    Tag:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 50
        color_hex:
          type: string
          maxLength: 7
        workspace:
          type: integer
      required:
      - id
      - name
      - workspace
    TagRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        color_hex:
          type: string
          minLength: 1
          maxLength: 7
        workspace:
          type: integer
      required:
      - name
      - workspace
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        phone:
          type: string
          maxLength: 20
        address:
          type: string
          maxLength: 255
      required:
      - id
      - username
    UserRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
        phone:
          type: string
          maxLength: 20
        address:
          type: string
          maxLength: 255
      required:
      - password
      - username
    Workspace:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        members:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceUser'
          readOnly: true
        deleted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        name:
          type: string
          maxLength: 100
        slug:
          type: string
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - deleted_at
      - id
      - members
      - name
      - slug
    WorkspaceMember:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        role:
          $ref: '#/components/schemas/RoleEnum'
        joined_at:
          type: string
          format: date-time
          readOnly: true
        user:
          type: integer
        workspace:
          type: integer
      required:
      - id
      - joined_at
      - user
      - workspace
    WorkspaceMemberRequest:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/RoleEnum'
        user:
          type: integer
        workspace:
          type: integer
      required:
      - user
      - workspace
    WorkspaceRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        slug:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
      required:
      - name
      - slug
    WorkspaceUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
      required:
      - id
      - username
    WorkspaceUserRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
      required:
      - username
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
